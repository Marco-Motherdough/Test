<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="backdrop">
    <div class="aurora"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <main class="stage">
    <div class="glass-card">
      <div class="glass-card__sheen"></div>

      <div class="brand">
        <div class="brand__icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C9 2 7 4.5 7 7.5c0 2 1 3.5 2 4.5-3 1-5 4-5 8h16c0-4-2-7-5-8 1-1 2-2.5 2-4.5C17 4.5 15 2 12 2z" fill="url(#g)"/>
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#c9d6ff"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue</p>
      </div>

      <form class="form" id="signin-form">
        <label class="field">
          <span class="field__label">Email</span>
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <div class="field__password">
            <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-visibility" id="toggle-visibility" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </label>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox" name="remember" />
            <span class="checkbox__box"></span>
            <span>Remember me</span>
          </label>
          <a href="#" class="link-muted">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">
          <span>Sign In</span>
        </button>

        <div class="divider"><span>or continue with</span></div>

        <div class="social-row">
          <button type="button" class="btn-social" aria-label="Sign in with Apple">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16.365 1.43c0 1.14-.415 2.06-1.245 2.86-.9.86-1.98 1.31-3.03 1.21-.12-1.11.42-2.2 1.24-2.98.86-.83 2.13-1.35 3.03-1.09zM20.5 17.2c-.5 1.15-.73 1.67-1.36 2.7-.9 1.46-2.17 3.28-3.75 3.3-1.4.02-1.76-.92-3.66-.91-1.9.01-2.3.93-3.7.91-1.58-.02-2.79-1.65-3.68-3.11C2.3 17.2 1.5 12.3 3.75 9.07c1.05-1.5 2.7-2.45 4.4-2.47 1.5-.02 2.2 1.02 3.66 1.02 1.45 0 2.09-1.02 3.66-.99 1.38.03 2.86.7 3.9 1.92-1.9 1.07-2.75 3.52-1.87 5.78.35.9.82 1.4.99 1.86z"/></svg>
          </button>
          <button type="button" class="btn-social" aria-label="Sign in with Google">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A10.99 10.99 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 010-4.2V7.05H2.18a11 11 0 000 9.9l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.85c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          </button>
          <button type="button" class="btn-social" aria-label="Sign in with GitHub">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.42.36.79 1.08.79 2.17v3.22c0 .3.21.66.79.55A10.51 10.51 0 0023.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
          </button>
        </div>
      </form>

      <p class="signup-hint">Don't have an account? <a href="#" class="link-accent">Sign up</a></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
